name: ci
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches: [master, main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements/*.txt}
      - run: pip install -r requirements/local.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: APP_SECRET_KEY=ci-only-secret-with-at-least-thirty-two-characters APP_ALLOWED_HOSTS=example.com DJANGO_SETTINGS_MODULE=config.settings.production python manage.py check --deploy
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm install
      - run: npm run build
      - run: npm test -- --run
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - run: docker build -f backend/Dockerfile.prod -t baran-api:${{ github.sha }} backend
      - run: docker build -f frontend/Dockerfile.prod -t baran-web:${{ github.sha }} frontend
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: baran-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
